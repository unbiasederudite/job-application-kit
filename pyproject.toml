[project]
name = "job-application-kit"
version = "0.1.0"
description = "Python environment for the job application kit plugin"
license = "MIT"
authors = [
    { name = "Mykhailo Stasiuk", email = "erudite1854@proton.me" },
]
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1",
    "ruamel.yaml>=0.19",
    "typst>=0.14.8",
    "rendercv[full]>=2.8,<3.0",
    "pdfplumber>=0.11",
    "phonenumbers>=8.13",
]

[project.scripts]
rendercl = "rendercl.cli.entry_point:entry_point"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skills/cover-letter/src/rendercl"]
